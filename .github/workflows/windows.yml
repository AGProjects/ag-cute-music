# The Windows AG CuteMusic, built on GitHub's Windows runner (windows/make-standalone.ps1): the installer and a zip
# of the app as the run's artifact. Not on every synced darcs patch, only:
#   - a new version: a patch that changes cutemusic/__init__.py (its __version__) when the sync brings it; also a
#     GitHub release v<version> with them
#   - a tag (a darcs tag synced as one): also a GitHub release of that tag
#   - by hand: Actions -> Windows -> Run workflow (the artifact only, no release)

name: Windows

on:
  push:
    branches: [main, master]
    paths: [cutemusic/__init__.py]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write         # the release, on a tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: windows\make-standalone.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: AG-CuteMusic-windows
          path: |
            dist/AG-CuteMusic-*-setup.exe
            dist/AG-CuteMusic-*-windows.zip
          if-no-files-found: error

      # as a user would: the installer run (silently, per user), the app started from where it installed itself, a
      # screenshot of its window after 20 s, its logs; then uninstalled. The screenshot and logs are the run's
      # artifact AG-CuteMusic-windows-trial
      - name: Trial
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force trial
          $setup = (Get-ChildItem dist\AG-CuteMusic-*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$out\install.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer: exit $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\AG CuteMusic"
          $exe = "$dir\AG CuteMusic.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          if (-not (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'AG CuteMusic.lnk')) { throw 'no Start menu entry' }
          Write-Host "installed: $exe"
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("$out\screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          # running is not enough: a Python exception leaves PyInstaller's "Unhandled exception in script" box up
          $alive = -not $app.HasExited
          $title = if ($alive) { (Get-Process -Id $app.Id).MainWindowTitle } else { '' }
          if ($alive) { Write-Host "running, window: '$title'" } else { Write-Host "exited: $($app.ExitCode)" }
          Copy-Item "$env:USERPROFILE\.ag-cute-music\*.log" $out -ErrorAction SilentlyContinue
          if ($alive) { Stop-Process -Id $app.Id -Force; Start-Sleep -Seconds 2 }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          foreach ($i in 1..30) { if (-not (Test-Path $exe)) { break }; Start-Sleep -Seconds 1 }   # (it finishes in a copy of itself)
          if (Test-Path $exe) { throw 'uninstall left the app' }
          Write-Host 'uninstalled'
          if (-not $alive) { throw 'the app did not stay running (see the logs in AG-CuteMusic-windows-trial)' }
          if ($title -notlike '*AG CuteMusic*') { throw "no AG CuteMusic window, the one up: '$title' (see screenshot.png)" }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: AG-CuteMusic-windows-trial
          path: trial/
          if-no-files-found: ignore

      # a new version (the push that changed __version__) or a tag: a GitHub release with the installer and the zip;
      # by hand (Run workflow): the artifact only. The release of a version is v<version> on the commit built
      - name: Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content cutemusic\__init__.py -Raw), "(?m)^__version__ = '(.*)'").Groups[1].Value
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $files = Get-ChildItem dist\AG-CuteMusic-*-setup.exe, dist\AG-CuteMusic-*-windows.zip | ForEach-Object FullName
          # the notes: debian/changelog's entry of this version (its bullets: what the app's update dialog shows)
          $entry = @(); $inside = $false
          foreach ($line in Get-Content debian\changelog) {
            if ($line -match "^\S+ \(([^)]+)\)") { if ($inside) { break }; $inside = $Matches[1] -eq $version; continue }
            if ($inside -and $line -match '^ -- ') { break }
            if ($inside -and $line.Trim()) { $entry += ($line -replace '^  \* ', '- ' -replace '^    ', '  ') }
          }
          $notes = ($entry -join "`n") + "`n`nThe installer (per user, no admin rights), or the zip: unpack it and run AG CuteMusic.exe."
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "AG CuteMusic $version" --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag @files --clobber
