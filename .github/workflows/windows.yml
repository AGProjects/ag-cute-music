# The Windows AG CuteMusic, built on GitHub's Windows runner (windows/make-standalone.ps1): the installer and a zip
# of the app as the run's artifact. Not on every synced darcs patch, only:
#   - a new version: a patch that changes cutemusic/__init__.py (its __version__) when the sync brings it; also a
#     GitHub release v<version> with them
#   - a tag (a darcs tag synced as one): also a GitHub release of that tag
#   - by hand: Actions -> Windows -> Run workflow (the artifact only, no release)
#
# The working copy is github/ (editable by Claude); .github/ is what GitHub reads: cp -r github/. .github/
name: Windows

on:
  push:
    branches: [main, master]
    paths: [cutemusic/__init__.py]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write         # the release, on a tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: windows\make-standalone.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AG-CuteMusic-windows
          path: |
            dist/AG-CuteMusic-*-setup.exe
            dist/AG-CuteMusic-*-windows.zip
          if-no-files-found: error

      # a new version (the push that changed __version__) or a tag: a GitHub release with the installer and the zip;
      # by hand (Run workflow): the artifact only. The release of a version is v<version> on the commit built
      - name: Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content cutemusic\__init__.py -Raw), "(?m)^__version__ = '(.*)'").Groups[1].Value
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $files = Get-ChildItem dist\AG-CuteMusic-*-setup.exe, dist\AG-CuteMusic-*-windows.zip | ForEach-Object FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "AG CuteMusic $version" --notes "AG CuteMusic $version for Windows: the installer (per user, no admin rights) or the zip (unpack and run AG CuteMusic.exe)."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag @files --clobber
