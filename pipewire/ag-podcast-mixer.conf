# AG Podcast Mixer on Linux (python3-sipsimple docs/PodcastMixerLink.md, v2): the PipeWire nodes between AG CuteMusic
# and Blink, always there (Blink is set to them once and left so), silent while the mixer is off.
#
#   ag_podcast_mixer_feed  "AG Podcast Mixer Feed"  a sink: AG CuteMusic plays the mix into it
#   ag_podcast_mixer       "AG Podcast Mixer"       a source: the Feed's sound (a loopback), Blink records it (its
#                                                   microphone). A playback stream can only be linked to a sink
#                                                   (WirePlumber), so the mix goes in through the Feed
#   ag_podcast_mixer_call  "AG Podcast Mixer Call"  a sink: Blink plays the call into it, AG CuteMusic records its
#                                                   monitor (the BLINK strip)
#   ag_podcast_streaming_feed  "AG Podcast Streaming Feed"  a sink: AG CuteMusic plays the recorder's mix into it
#                                                   while STREAMING is on
#   ag_podcast_streaming   "AG Podcast Streaming"   a source: the Streaming Feed's sound (a loopback), for a streaming
#                                                   app (OBS...). Always there: the streaming app set up once, before,
#                                                   and left so (silent while STREAMING is off)
#
# Blink's SIP audio reaches them through ALSA (the SDK has no other backend on Linux): the PCM ag_cutemusic_mixer in
# /etc/alsa/conf.d/60-ag-cute-music.conf, PipeWire's ALSA plugin on ag_podcast_mixer and ag_podcast_mixer_call by name.
#
# Priority 0: never chosen as a default device. Installed in /usr/share/pipewire/pipewire.conf.d by the package; read
# when PipeWire starts (the next login, or: systemctl --user restart pipewire).

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "AG Podcast Mixer"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            capture.props = {
                node.name        = "ag_podcast_mixer_feed"
                node.description = "AG Podcast Mixer Feed"
                media.class      = "Audio/Sink"
                priority.session = 0
                priority.driver  = 0
                node.virtual     = true
            }
            playback.props = {
                node.name        = "ag_podcast_mixer"
                node.description = "AG Podcast Mixer"
                media.class      = "Audio/Source"
                priority.session = 0
                priority.driver  = 0
                node.virtual     = true
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "AG Podcast Streaming"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            capture.props = {
                node.name        = "ag_podcast_streaming_feed"
                node.description = "AG Podcast Streaming Feed"
                media.class      = "Audio/Sink"
                priority.session = 0
                priority.driver  = 0
                node.virtual     = true
            }
            playback.props = {
                node.name        = "ag_podcast_streaming"
                node.description = "AG Podcast Streaming"
                media.class      = "Audio/Source"
                priority.session = 0
                priority.driver  = 0
                node.virtual     = true
            }
        }
    }
]

context.objects = [
    {   factory = adapter
        args = {
            factory.name           = support.null-audio-sink
            node.name              = "ag_podcast_mixer_call"
            node.description       = "AG Podcast Mixer Call"
            media.class            = "Audio/Sink"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            priority.session       = 0
            priority.driver        = 0
            node.virtual           = true
            object.linger          = true
            monitor.channel-volumes = true
        }
    }
]
