# AG CuteMusic's mixer as one sound device, for Blink (Devices -> AG Podcast Mixer): what is played on it goes
# to the mixer's BLINK strip (the PipeWire sink ag_podcast_mixer_call), what is recorded from it is the karaoke (the
# source ag_podcast_mixer: the mic, and the music while TO CALLS is on). Both are always there with PipeWire
# (/usr/share/pipewire/pipewire.conf.d/ag-podcast-mixer.conf); without it AG CuteMusic makes them while its mixer is
# on (cutemusic/share.py). Blink's SIP audio reaches them only through ALSA (the SDK has no other backend on Linux).
#
# Installed in /etc/alsa/conf.d by the package. Without it, AG CuteMusic sets the same definition up in the user's
# ALSA configuration at its first start (cutemusic/share.py, ensure_alsa_device: keep the two alike). Blink reads it
# when it starts.

pcm.ag_cutemusic_mixer {
    type pipewire           # PipeWire's ALSA plugin (pipewire-alsa): its nodes by name, one for each direction
    playback_node "ag_podcast_mixer_call"
    capture_node "ag_podcast_mixer"
    hint {
        show on
        description "AG Podcast Mixer"
    }
}
